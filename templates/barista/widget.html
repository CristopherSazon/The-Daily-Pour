{% load static %}
<button class="barista-launcher" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="barista-title" aria-label="Ask the barista">
  {% include "components/icon.html" with name="coffee" %}
</button>
<dialog class="barista-dialog" aria-labelledby="barista-title">
  <div class="barista-dialog-content">
    <button class="product-dialog-close" type="button" aria-label="Close the barista">{% include "components/icon.html" with name="x" %}</button>
    <p class="eyebrow">THE BAR</p>
    <h2 id="barista-title">Ask the barista.</h2>
    <div class="barista-log" aria-live="polite"></div>
    <form class="barista-form">
      {% csrf_token %}
      <label>
        <span class="sr-only">Ask the barista</span>
        <input type="text" maxlength="400" placeholder="Something warm, not too sweet" autocomplete="off">
      </label>
      <button class="button button-dark" type="submit">Ask</button>
    </form>
  </div>
</dialog>
<script src="{% static 'pours/barista.js' %}"></script>
